name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and authenticate the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; let an in-progress run finish (don't drop a deploy).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: the study move-trees must be legal + consistent. verify_studies.py
  # checks GBR material/side-to-move and that every SAN is legal from its parent
  # and lands on its recorded fenAfter. `astro build` only validates the Zod
  # schema shape (strings), not chess validity, so this catches broken study
  # data before it can deploy. Fast (~0.5s) — no PDF, no network, just python-chess.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify study move-trees
        run: uv run python scripts/verify_studies.py --fail-only

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
        env:
          # GA4 measurement id (G-XXXXXXXXXX). Set the repo variable to enable
          # analytics; left unset, GoogleAnalytics.astro emits nothing.
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
